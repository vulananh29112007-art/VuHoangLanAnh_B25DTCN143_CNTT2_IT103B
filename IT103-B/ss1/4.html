<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chuẩn hóa tên sách</title>
</head>

<body>
    <script>
        let nameBook = prompt("Nhập tên sách");
        console.log("Tên gốc: " + nameBook);
        console.log("Tên viết hoa toàn bộ: " + nameBook.toUpperCase());
        console.log("Tên viết thường toàn bộ: " + nameBook.toLowerCase());
    </script>
</body>

</html>
