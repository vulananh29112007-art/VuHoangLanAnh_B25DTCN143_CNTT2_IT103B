<body>
    <script>
        function isNullOrUndefined(value) {
            if (value === null || value === undefined) {
                return true;
            }
            return false;
        }
        console.log(isNullOrUndefined(null));
        console.log(isNullOrUndefined(undefined));
        console.log(isNullOrUndefined("HIHI"));
    </script>
</body>
