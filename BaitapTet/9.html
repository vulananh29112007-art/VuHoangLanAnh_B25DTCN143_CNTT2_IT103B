<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let day = Number(prompt("Nhập số từ 1 đến 7:"));

        switch (day) {
            case 1:
                console.log("Thứ Hai");
                break;
            case 2:
                console.log("Thứ Ba");
                break;
            case 3:
                console.log("Thứ Tư");
                break;
            case 4:
                console.log("Thứ Năm");
                break;
            case 5:
                console.log("Thứ Sáu");
                break;
            case 6:
                console.log("Thứ Bảy");
                break;
            case 7:
                console.log("Chủ Nhật");
                break;
            default:
                console.log("Số không hợp lệ");
        }

    </script>
</body>

</html>
