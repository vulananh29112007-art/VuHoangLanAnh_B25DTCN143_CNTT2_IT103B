<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let input = Number(prompt("Nhập số cần kiểm tra:"));
        if (input > 100 && input < 1000) console.log(`${input} nằm trong khoảng 100 đến 1000`);
        else console.log(`${input} khổng thuộc trong khoảng`);        
    </script>
</body>

</html>
