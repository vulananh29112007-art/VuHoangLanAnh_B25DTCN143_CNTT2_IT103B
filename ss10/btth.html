<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bài tập thực hành</title>
</head>

<body>
    <script>
        let squad = [

            { id: 1, name: "Nguyen Van A", goals: 10, position: "FW" },

            { id: 2, name: "Tran Van B", goals: 5, position: "MF" },

            { id: 3, name: "Le Van C", goals: 0, position: "DF" },

            { id: 4, name: "Pham Van D", goals: 12, position: "FW" },

            { id: 5, name: "Dang Van E", goals: 0, position: "GK" }

        ];

        let choice;
        do {
            choice = +prompt(`MENU
            1. Xem danh sách
            2. Thêm cầu thủ
            3. Tìm kiếm ( theo ID )
            4. Cập nhật bàn thắng
            5. Xóa cầu thủ
            0. Thoát
            Mời bạn nhập lựa chọn:`);

            switch (choice) {
                case 1: {
                    squad.forEach((player) => {
                        console.log(`Mã ${player.id} - ${player.name} (${player.position}): ${player.goals} bàn`);
                    })
                    break;
                }
                case 2: {
                    let name = prompt("Nhập tên:");
                    let goals = prompt("Nhập số bàn thắng:");
                    let position = prompt("Nhập vị trí:");
                    let newPlayer = {
                        id: squad.length > 0 ? squad[squad.length - 1].id + 1 : 1,
                        name,
                        goals,
                        position,
                    }
                    squad.push(newPlayer);
                    break;
                }
                case 3: {
                    let findID = +prompt("Mời nhập ID cần tìm:");
                    let foundID = squad.find(s => s.id == findID);
                    if (foundID) console.log(`Mã: ${foundID.id} - ${foundID.name} (${foundID.position}) - ${foundID.goals} bàn thắng`);
                    else console.log("Không tìm thấy cầu thủ");
                    break;
                }
                case 4: {
                    let findID = +prompt("Mời nhập ID cần tìm:");
                    let foundID = squad.find(s => s.id == findID);
                    if (foundID) console.log(`${foundID.goals++}`);
                    else conssole.log("Không tìm thấy ID");
                    break;
                }
                case 5: {
                    let findID = +prompt("Mời nhập ID cần xóa khỏi đội:");
                    let foundID = squad.findIndex(s => s.id == findID);
                    if (foundID == -1) {
                        console.log("Không tìm thấy vị trí cầu thủ cần xóa");
                    } else {
                        let delPlayer = squad.splice(foundID, 1);
                        console.log(delPlayer);
                    }
                    break;
                }
                case 0: {
                    console.log("Thoát chường trình");
                    break;
                }
                default: {
                    console.log("Lựa chọn không hợp lệ, hãy chọn lại");
                }
            }
        } while (choice != 0);

    </script>
</body>

</html>
