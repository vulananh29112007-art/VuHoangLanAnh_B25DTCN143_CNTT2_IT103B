<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bài 4</title>
</head>

<body>
    <script>
        const players = [
            { name: "Messi", years: 18, salary: 100 },
            { name: "Ronaldo", years: 20, salary: 95 },
            { name: "Neymar", years: 12, salary: 90 },
            { name: "Mbappe", years: 7, salary: 85 },
            { name: "Haaland", years: 5, salary: 80 },
            { name: "Modric", years: 22, salary: 70 },
            { name: "Benzema", years: 19, salary: 75 },
        ];

        let analyzeSalary = (minYears, teamPlayers) => {

            let filteredPlayers = teamPlayers
                .filter(player => player.years >= minYears);

            let totalSalary = filteredPlayers
                .reduce((total, value) => total + value.salary, 0);

            let maxSalary = filteredPlayers
                .reduce((max, value) =>
                    value.salary > max ? value.salary : max
                    , filteredPlayers[0]?.salary || 0);

            let minSalary = filteredPlayers
                .reduce((min, value) =>
                    value.salary < min ? value.salary : min
                    , filteredPlayers[0]?.salary || 0);

            console.log(`Total Salary: ${totalSalary}`);
            console.log(`Max Salary: ${maxSalary}`);
            console.log(`Min Salary: ${minSalary}`);
        };

        analyzeSalary(10, players);
        analyzeSalary(30, players);
    </script>
</body>

</html>
