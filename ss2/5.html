<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý sách theo trạng thái và năm xuất bản</title>
</head>

<body>
    <script>
        let bookName = prompt("Nhập tên sách:");
        let bookCondition = prompt("Nhập tình trạng sách");
        let year = +prompt("Nhập năm xuất bản");
        let age = +(2026 - year);

        if (bookCondition == "có sẵn") {
            if (age <= 5) {
                console.log("Sách này mới và có sẵn để mượn")
            } else {
                console.log("Sách này có sẵn nhưng đã lâu năm");
            }
        }
        if (bookCondition == "đã mượn") {
            if (age <= 10) {
                console.log("Sách này đã mượn nhưng khá mới, có thể mượn lại sau");
            } else {
                console.log("Sách này đã mượn và khá cũ");
            }
        }
    </script>
</body>

</html>
