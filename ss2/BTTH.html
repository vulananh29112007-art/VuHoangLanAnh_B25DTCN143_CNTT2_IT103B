<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Bài tập tổng hợp</title>
</head>

<body>
    <script>
        let userName = prompt("Nhập tên người dùng:");
        let role = prompt("Nhập vai trò (admin / student / guest):");
        let balance = +prompt("Nhập số dư tài khoản:");
        let cardStatusInput = prompt("Trạng thái thẻ (true nếu hoạt động):");
        let overdueDays = +prompt("Nhập số ngày quá hạn:");

        let normalizedName = userName ? userName.trim().toUpperCase() : "";
        let normalizedRole = role ? role.trim().toLowerCase() : "";
        let cardStatus = cardStatusInput === "true";

        let roleMessage = "";

        switch (normalizedRole) {
            case "admin":
                roleMessage = "Chào Admin, bạn có toàn quyền hệ thống";
                break;
            case "student":
                roleMessage = "Chào sinh viên, bạn có thể mượn sách";
                break;
            case "guest":
                roleMessage = "Chào khách, bạn chỉ có thể đọc tại chỗ";
                break;
            default:
                roleMessage = "Lỗi: Vai trò không hợp lệ!";
        }

        let canBorrow = true;
        let borrowMessage = "ĐƯỢC PHÉP MƯỢN SÁCH";
        let reason = "";

        if (!normalizedName) {
            canBorrow = false;
            reason = "Tên người dùng không được để trống";
        } else if (!(normalizedRole === "admin" || normalizedRole === "student")) {
            canBorrow = false;
            reason = "Vai trò không được phép mượn sách";
        } else if (balance <= 0) {
            canBorrow = false;
            reason = "Số dư tài khoản không đủ";
        } else if (!cardStatus) {
            canBorrow = false;
            reason = "Thẻ thư viện đang bị khóa";
        }

        if (!canBorrow) {
            borrowMessage = `YÊU CẦU BỊ TỪ CHỐI (${reason})`;
        }

        let fine = 0;
        let returnStatus = "";

        if (overdueDays <= 0) {
            returnStatus = "Cảm ơn bạn đã trả đúng hạn";
        } else if (overdueDays <= 5) {
            fine = overdueDays * 5000;
            returnStatus = `Quá hạn ${overdueDays} ngày`;
        } else if (overdueDays <= 10) {
            fine = overdueDays * 10000;
            returnStatus = `Quá hạn ${overdueDays} ngày`;
        } else {
            fine = 200000;
            returnStatus = `Quá hạn ${overdueDays} ngày - TÀI KHOẢN BỊ KHÓA`;
        }

        console.log(`--- HỆ THỐNG MƯỢN TRẢ ---

Người dùng: ${normalizedName}

Quyền hạn: ${roleMessage}

Kết quả mượn: ${borrowMessage}

Tình trạng trả sách: ${returnStatus}

Tiền phạt: ${fine} VNĐ
        `);
    </script>
</body>

</html>
