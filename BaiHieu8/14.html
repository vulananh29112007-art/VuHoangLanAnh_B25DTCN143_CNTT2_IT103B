<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let age = Number(prompt("Nhập tuổi:"));
        let hasCCCD = prompt("Bạn có CCCD không? (yes/no)");

        if (age >= 18 && hasCCCD === "yes") {
            console.log("Bạn đủ điều kiện");
        } else {
            console.log("Bạn chưa đủ điều kiện");
        }

    </script>
</body>

</html>
