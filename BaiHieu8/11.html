<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let input = prompt("Nhập vào một chuỗi bất kỳ:");
        let reversed = "";
        for (let i = input.length - 1; i >= 0; i--) {
            reversed += input[i];
        }
        console.log(`Chuỗi đảo ngược: ${reversed}`)
    </script>
</body>

</html>
