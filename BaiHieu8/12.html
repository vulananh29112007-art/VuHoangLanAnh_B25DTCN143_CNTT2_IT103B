<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>

<body>
    <script>
        function input() {
            let num = Number(prompt("Nhập 1 số bất kỳ: "));
            if (num < 0) {
                return -num;
            }
            return num;
        }
        console.log(input());
    </script>
</body>
