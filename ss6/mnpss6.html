<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Quản lý thư viện</title>
</head>

<body>
    <script>
        let attempts = 0;
        let isAuthenticated = false;
        const ADMIN_USER = "admin";
        const ADMIN_PASS = "12345";

        while (attempts < 3) {
            let user = prompt("Tên đăng nhập:");
            let pass = prompt("Mật khẩu:");

            if (user === ADMIN_USER && pass === ADMIN_PASS) {
                alert("Đăng nhập thành công!");
                isAuthenticated = true;
                break;
            } else {
                attempts++;
                alert(`Sai thông tin! Còn ${3 - attempts} lần thử.`);
            }
        }

        if (!isAuthenticated) {
            alert("Tài khoản đã bị khóa!");
        } else {
            let libraries = ["Toán", "Văn", "Anh"];
            let choice;

            do {
                let menu = `--- HỆ THỐNG QUẢN TRỊ THƯ VIỆN ---
1. Nhập thêm lô sách mới
2. Hiển thị danh sách sách
3. Tìm kiếm sách
4. Cập nhật tên sách
5. Đảo ngược thứ tự kệ sách
6. Nhập kho từ nguồn khác
7. Thoát
Chọn (1-7):`;

                choice = Number(prompt(menu));

                switch (choice) {
                    case 1:
                        let input = prompt("Nhập tên sách (ngăn cách bằng dấu phẩy):");
                        if (input) {
                            let newBooks = input.split(",");
                            let count = 0;

                            for (let i = 0; i < newBooks.length; i++) {
                                let book = newBooks[i].trim();
                                if (book !== "") {
                                    libraries.push(book);
                                    count++;
                                }
                            }
                            alert(`Đã thêm ${count} cuốn sách.`);
                        }
                        break;

                    case 2:
                        console.clear();
                        for (let i = 0; i < libraries.length; i++) {
                            console.log(`${i + 1}. ${libraries[i]}`);
                        }
                        alert("Danh sách đã in ra console (F12)");
                        break;

                    case 3:
                        let searchName = prompt("Nhập tên sách cần tìm:");
                        let index = libraries.indexOf(searchName);

                        if (index !== -1) {
                            alert(`Sách "${searchName}" ở vị trí ${index}`);
                        } else {
                            alert("Không tìm thấy sách");
                        }
                        break;

                    case 4:
                        let oldName = prompt("Nhập tên sách cần sửa:");
                        let foundIndex = libraries.indexOf(oldName);

                        if (foundIndex !== -1) {
                            let newName = prompt("Nhập tên mới:");
                            if (newName) {
                                libraries[foundIndex] = newName;
                                alert("Cập nhật thành công!");
                            }
                        } else {
                            alert("Sách không tồn tại");
                        }
                        break;

                    case 5:
                        libraries.reverse();
                        console.clear();
                        for (let i = 0; i < libraries.length; i++) {
                            console.log(`${i + 1}. ${libraries[i]}`);
                        }
                        alert("Đã đảo ngược kệ sách");
                        break;

                    case 6:
                        let externalLibrary = ["Sách Kỹ Năng", "Truyện Tranh"];
                        libraries = libraries.concat(externalLibrary);
                        alert("Đã nhập kho từ chi nhánh khác");
                        break;

                    case 7:
                        alert("Hẹn gặp lại!");
                        break;

                    default:
                        alert("Lựa chọn không hợp lệ!");
                }
            } while (choice !== 7);
        }
    </script>
</body>

</html>
