<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bài 4</title>
</head>

<body>
    <script>
        let players = [
            "P001-Nguyễn Văn A-Thủ môn",
            "P002-Trần Thị B-Hậu vệ",
            "P003-Lê Văn C-Hậu vệ",
            "P004-Phạm Văn D-Tiền vệ",
            "P005-Hoàng Thị E-Tiền đạo",
            "P006-Vũ Minh F-Tiền đạo",
            "P007-Đặng Văn G-Thủ môn",
        ];

        function printTeamRoster() {
            console.log("STT | Mã | Tên | Vị trí");
            for (let i = 0; i < players.length; i++) {
                let data = players[i].split("-");
                let id = data[0];
                let name = data[1];
                let position = data[2];

                console.log(`${i + 1}. ${id} | ${name} | ${position}`);
            }
        }

        function countPlayerByPosition() {
            let count = {};

            for (let i = 0; i < players.length; i++) {
                let position = players[i].split("-")[2];

                if (count[position] === undefined) {
                    count[position] = 1;
                } else {
                    count[position]++;
                }
            }

            return count;
        }

        function hasGoalkeeper() {
            for (let i = 0; i < players.length; i++) {
                let position = players[i].split("-")[2];
                if (position === "Thủ môn") {
                    return true;
                }
            }
            return false;
        }

        printTeamRoster();
        console.log("Số lượng theo vị trí:", countPlayerByPosition());
        console.log("Có thủ môn không:", hasGoalkeeper());

    </script>
</body>

</html>
