<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bài 5</title>
</head>

<body>
    <script>
        let players = [
            "P001-Nguyễn Văn A-Thủ môn",
            "P002-Trần Thị B-Hậu vệ",
            "P003-Lê Văn C-Hậu vệ",
            "P004-Phạm Văn D-Tiền vệ",
            "P005-Hoàng Thị E-Tiền đạo",
            "P006-Vũ Minh F-Tiền đạo",
            "P007-Đặng Văn G-Thủ môn",
        ];

        function getAllPositions() {
            let positions = [];

            for (let i = 0; i < players.length; i++) {
                let parts = players[i].split("-");
                let position = parts[2];

                if (positions.indexOf(position) === -1) {
                    positions.push(position);
                }
            }

            return positions;
        }

        function findPlayersWithLongestName() {
            let longestName = "";

            for (let i = 0; i < players.length; i++) {
                let parts = players[i].split("-");
                let name = parts[1];

                if (name.length > longestName.length) {
                    longestName = name;
                }
            }

            return longestName;
        }

        function countPlayersStartingWithLetter(letter) {
            let count = 0;
            letter = letter.toLowerCase();

            for (let i = 0; i < players.length; i++) {
                let parts = players[i].split("-");
                let name = parts[1].toLowerCase();

                if (name[0] === letter) {
                    count++;
                }
            }

            return count;
        }

        console.log("Vị trí trong đội:", getAllPositions());
        console.log("Tên dài nhất:", findPlayersWithLongestName());
        console.log("Số cầu thủ bắt đầu bằng 'N':", countPlayersStartingWithLetter("N"));

    </script>
</body>

</html>
