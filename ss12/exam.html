<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bài kiểm tra</title>
</head>

<body>
    <script>
        let products = [
            { id: "P01", name: "Laptop Macbook Pro M3", price: 2000, category: "Laptop", inStock: true },
            { id: "P02", name: "Chuột không dây Logitech", price: 45, category: "Phụ kiện", inStock: true },
            { id: "P03", name: "Bàn phím cơ Keychron", price: 95, category: "Phụ kiện", inStock: false },
            { id: "P04", name: "Màn hình Dell UltraSharp", price: 450, category: "Màn hình", inStock: true },
            { id: "P05", name: "Tai nghe Sony WH-1000XM5", price: 350, category: "Phụ kiện", inStock: true }
        ];

        // 1️⃣ Lọc sản phẩm còn hàng và sắp xếp theo giá tăng dần
        const filterAndSort = () => {
            let result = products.filter(p => p.inStock).sort((a, b) => a.price - b.price);

            console.log("Danh sách sản phẩm còn hàng (đã sắp xếp):");
            console.log(result);
        };

        // 2️⃣ Lọc theo danh mục "Phụ kiện"
        const information = () => {
            let result = products.filter(p => p.category === "Phụ kiện");
            console.log(`Danh sách sản phẩm thuộc Phụ kiện: ${result.map(p => p.name)}`);
        };

        // 3️⃣ Tính tổng giá sản phẩm còn hàng
        const totalPrice = () => {
            let total = products.filter(p => p.inStock).reduce((sum, value) => sum + value.price, 0);

            console.log("Tổng giá sản phẩm còn hàng:", total);
        };

        filterAndSort();
        information();
        totalPrice();
    </script>
</body>

</html>
