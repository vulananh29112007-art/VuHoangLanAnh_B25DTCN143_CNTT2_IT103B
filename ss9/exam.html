<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài kiểm tra</title>
</head>

<body>
    <script>
        let orders = ["Đơn hàng A", "Đơn hàng B", "Đơn hàng C", "Đơn hàng D", "Đơn hàng E"];
        let revenues = [1500, 2800, 1200, -500, 3200];
        console.log(`Báo Cáo`);
        for (let i = 0; i < orders.length; i++) {
            console.log(`${orders[i]} mang về ${revenues[i]} USD`);
        }

        let revenuesNew = revenues.filter(price => price > 0);
        console.log(revenuesNew);
        let total = revenuesNew.reduce((acc, value, _) => {
            acc += value;
            return acc;
        }, 0);
        console.log(total);

    </script>
</body>

</html>
