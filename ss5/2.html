<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý danh sách sách quá hạn trả</title>
</head>

<body>
    <script>
        let bookLate = [];
        let bookNumber = parseInt(prompt("Hôm nay có bao nhiêu cuốn sách bị trả muộn?"));
        while (bookNumber <= 0) {
            bookNumber = parseInt(prompt("Vui lòng nhập số nguyên dương cho số sách bị trả muộn:"));
        }

        for (let i = 0; i < bookNumber; i++) {
            let bookName = prompt(`Nhập tên cuốn sách bị trả muộn thứ ${i + 1}: `);

            bookLate.push(bookName);
        }
        console.log(`Tổng số sách bị trả muộn: ${bookNumber}`);
        console.log("Danh sách sách bị trả muộn:");
        let count = 0;
        for (let i = 0; i < bookNumber; i++) {
            console.log(`${i + 1}. ${bookLate[i]}`);
            if (bookLate[i].length > 20) {
                count++;
            }
        }
        console.log(`Số lượng sách có tên dài hơn 20 ký tự: ${count}`);
    </script>
</body>

</html>
